# Калибровочный набор (PLAN этап 5, DEC-012): отрывки для слепого сравнения моделей-редакторов
# и для проверки любой будущей смены модели. Собирается: python -m tools.calibration.build
# window — абзацы RU отрывка; context — абзацы RU вокруг (показываются для понимания, не оцениваются).
passages:
  - id: cal-1-narrative
    chapter: p1-c01
    genre: обычное повествование и описание от первого лица (рассказчик Левушка)
    window: [41, 62]
    context: [39, 63]
    why: сцена у дерева и приезд Наль — описание, мало диалога; есть сложные связи абзацев (6:3, 3:1)
  - id: cal-2-drama
    chapter: p1-c12
    genre: драматическая сцена, первое лицо
    window: [40, 55]
    context: [38, 57]
    why: кульминация бури на капитанском мостике — динамика, короткие реплики, описание стихии
  - id: cal-3-dialogue
    chapter: p2-c01
    genre: повествование от третьего лица, живой светский диалог (Лондон)
    window: [252, 271]
    context: [250, 273]
    why: визит к пастору — знакомство, юмор, речь разных персонажей, британский быт
  - id: cal-4-teaching
    chapter: p3-c01
    genre: письмо Учителя — поучение, возвышенный стиль
    window: [66, 84]
    context: [65, 87]
    why: письмо Али Левушке — ключевые понятия учения (верность, Община, радость, знание)
  - id: cal-5-verse
    chapter: p1-c20
    genre: стихи (песня Ананды) — оценивается отдельно от прозы
    window: [212, 215]
    context: [210, 216]
    why: единственное стихотворение части I; проверка работы с ритмом и образностью
    evaluate: separately
