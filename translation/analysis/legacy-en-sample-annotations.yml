# Разметка выборки старого английского перевода (этап 2), версия 3 — после внутреннего и внешнего ревью
# (translation/reviews/en/analysis-legacy/internal-*.json, external-*.json; разбор — resolution.md там же).
# Выборка: окна калибровочного набора translation/calibration/cal-*.md (контекст не размечается).
# Разметчик: Claude (сессия Claude Code). Метрики считает tools/analysis/sample_metrics.py.
#
# КАТЕГОРИИ (TRANSLATION-PROCESS §7.4): mistranslation, omission, addition, terminology, name, grammar,
#   fluency, style, register, typography. Особая категория source-divergence — НЕ ошибка перевода и в метрики
#   не входит: в EN есть связное содержание, которого нет ни в одной из трёх наших частей RU, и есть ВНЕШНИЙ
#   признак, что оно есть в другой русской редакции (поиск по точной фразе). Поле evidence: search | search-weak.
#
# ШКАЛА СЕРЬЁЗНОСТИ (одинаково для всех отрывков):
#   critical — смысл ключевого утверждения (поучение, важная сюжетная деталь) стал ложным или противоположным;
#   major    — смысловая ошибка в предложении: кто что делает, подмена понятия или сквозного термина, идиома
#              с другим смыслом, обратная связка или коннотация, изменённая сюжетная деталь; фраза не собрана так,
#              что смысл не восстанавливается однозначно; в стихах — потеря строки смысла или песенной организации
#              (по совокупности потерь: отсутствие рифмы само по себе major не делает);
#   minor    — неточное слово без изменения сцены или мысли, опущенный второстепенный определитель, читаемая
#              калька, локальная грамматика (артикль, предлог, порядок в словосочетании), пунктуация, опечатка.
#   Каждое вхождение сквозной ошибки (например «мир» → calm) считается отдельно, с одной и той же серьёзностью.
#   ЕДИНИЦА ПОДСЧЁТА: находка = один независимый дефект. Два смысловых сдвига в одной фразе — две находки
#   (каждая со своей серьёзностью); одна ошибка, захватившая несколько слов, — одна находка. Для critical и major
#   правило применено ко всей разметке; minor-находка может объединять несколько мелких дефектов одного фрагмента,
#   поэтому главная метрика — critical+major.
#   Серьёзность не зависит от того, сколько правки нужно: несобранная фраза, смысл которой однозначно
#   восстанавливается (есть сказуемое, тема вынесена), — minor.
#   Экспликация, нужная англоязычному читателю и не вносящая нового содержания, ошибкой не считается.
#
# edition_candidate: true — содержание без опоры в нашей RU, которое теоретически может восходить к другой
#   редакции (до решения D14). В варианте метрик B такие находки исключаются.
# fix — предлагаемый правильный вариант (иллюстрация, не окончательная редактура).
#
# УРОВНИ ПРАВКИ БЛОКА (levels): L0 — оставить; L1 — точечно (слово, опечатка, пунктуация, артикль);
#   L2 — построчная редактура (грамматика, кальки, порядок, выбор слов; структура и образы сохраняются);
#   L3 — переписать отдельные фразы из-за смысловых ошибок; L4 — перевести блок заново (L3 понадобился бы
#   для большинства фраз блока). Major, который исправляется заменой или удалением слов без перестройки фразы
#   (p1-c12-046, «остов» в p2-c01-261), сам по себе L3 не требует. Уровень — глубина правки, не серьёзность:
#   блок с одними minor может требовать L2, если нужны перестройка конструкции, времени или порядка слов.
#   У каждого блока L1+ есть хотя бы одна находка (проверяет скрипт).

