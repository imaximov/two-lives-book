# Разметка выборки старого английского перевода (этап 2).
# Выборка: окна калибровочного набора translation/calibration/cal-*.md (контекст не размечается).
# Разметчик: Claude (сессия Claude Code), 2026-09-27. Метрики считает tools/analysis/sample_metrics.py.
#
# Категории (TRANSLATION-PROCESS §7.4): mistranslation, omission, addition, terminology, name, grammar,
#   fluency, style, register, typography.
# Особая категория source-divergence — НЕ ошибка перевода: в EN есть содержание, которого нет в нашей
#   RU-редакции, но есть признаки, что оно есть в другой русской редакции (см. evidence). В метрики ошибок
#   не входит.
# Серьёзность: critical — искажён смысл важного места или пропущено важное; major — заметная смысловая
#   неточность или ошибка, которую заметит читатель; minor — мелочь.
# Уровни правки блока (levels): L0 — оставить; L1 — точечные исправления (опечатка, пунктуация, артикль,
#   слово); L2 — построчная редактура (грамматика, кальки, порядок слов, выбор слов; структура и образы
#   сохраняются); L3 — переписать отдельные фразы из-за смысловых ошибок; L4 — перевести блок заново.

