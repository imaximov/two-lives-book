  - {id: p2-c01-259, cat: grammar, sev: minor, en: "she’s even an exact her copy", note: "порядок слов"}
  - {id: p2-c01-259, cat: name, sev: minor, ru: "Уодсворд; Алиса", en: "Wodsword; Alyssa", note: "транслитерации имён — решить в глоссарии (Wadsworth? Alice?)"}
  - {id: p2-c01-259.2, cat: source-divergence, evidence: search, ru: "Девушки и мать отшучивались.", en: "…while he kept telling the guests about their impatience with humour. He told them about his youngest daughter that today she had decided to run to the bride’s house secretly…", note: "эпизода о младшей дочери нет в нашей RU; поиск возвращает близкую русскую фразу («младшая дочь даже решила пойти посмотреть хотя бы дом невесты…»), но первоисточник не открыт — доказательность слабая"}
  - {id: p2-c01-260, cat: fluency, sev: minor, ru: "заразительно засмеялась младшая", en: "the girl was laughing infectiously … the beauty from oversea … exceeds everything what one could imagine", note: "«младшая» потеряно; «overseas»; «everything what» (см. корпус)"}
  - {id: p2-c01-261, cat: mistranslation, sev: minor, ru: "Она казалась остовом семьи.", en: "It seemed that she was that little link which was connecting their family.", note: "«остов» = опора, стержень (mainstay), не «little link»"}
  - {id: p2-c01-261, cat: mistranslation, sev: minor, ru: "принимающих приятных, но чужих людей", en: "accepting kind, but strange people", note: "«чужих» = посторонних (strangers), «strange» — странных"}
  - {id: p2-c01-261, cat: source-divergence, evidence: pattern, en: "while the atmosphere of joy that was covering her used to create an ordinary relationship with the girl … having clapped her hands like a child, she was talking", note: "фрагментов нет в нашей RU"}
  - {id: p2-c01-263, cat: name, sev: minor, ru: "Флорентийца", en: "Florentian", note: "«Флорентиец» → «Florentian»; естественнее «the Florentine» — решить в глоссарии"}
  - {id: p2-c01-264, cat: addition, sev: minor, ru: "низко присела в реверансе", en: "made a deep curtsy to both men", note: "«to both men» нет в RU"}
  - {id: p2-c01-265, cat: fluency, sev: minor, ru: "по-моему", en: "According to me", note: "неидиоматично («In my opinion»); по корпусу единичный случай"}
  - {id: p2-c01-267, cat: addition, sev: minor, ru: "У нас, по старинному обычаю, чай пьют в столовой.", en: "According to the old custom of our forefathers, we drink the tea not in the sitting-room, but in the dining-room.", note: "экспликации «of our forefathers», «not in the sitting-room»"}
  - {id: p2-c01-269, cat: omission, sev: minor, ru: "всё самое высокое и благородное, что выходит из нашего дома", en: "Everything what is the most honourable and generous always belongs to him", note: "«что выходит из нашего дома» опущено; «everything what»"}
  - {id: p2-c01-271, cat: mistranslation, sev: minor, ru: "Это верно до некоторой степени, потому что мы все очень дружны.", en: "On a certain scale – yes, although we all are very friendly.", note: "«потому что» → «although» — связь мыслей перевёрнута"}

  # ───────────── cal-4-teaching (p3-c01) ─────────────
  - {id: p3-c01-066.2, cat: terminology, sev: minor, ru: "условного разъединения", en: "conditional separation", note: "«условный» здесь = мнимый, внешний (apparent/conventional), не «conditional»"}
  - {id: p3-c01-067, cat: fluency, sev: minor, ru: "равноправным членом моей семьи", en: "as the member of my family enjoying equal rights", note: "калька; «as a full member of my family»"}
  - {id: p3-c01-067, cat: terminology, sev: minor, ru: "идущие путем труда и совершенствования", en: "walking the path of their development and work", note: "«совершенствование» (self-perfection) → «development»: сквозное понятие, в глоссарий"}
  - {id: p3-c01-068, cat: name, sev: minor, ru: "сэра Уоми", en: "sir Vomi", note: "транслитерация «Уоми» → «Vomi» сомнительна, но по корпусу последовательна во всех томах (257/83/34) — вопрос глоссария; «sir» со строчной"}
  - {id: p3-c01-068, cat: register, sev: minor, ru: "И. поведет тебя … Ты будешь владеть силами", en: "I. is going to lead you … You are going to control", note: "разговорное «be going to» в возвышенном письме Учителя — систематически в отрывке (070, 071)"}
  - {id: p3-c01-068, cat: grammar, sev: minor, en: "You were endowed more than many of them", note: "«You have been given more than many of them»"}
  - {id: p3-c01-069, cat: mistranslation, sev: minor, ru: "чтобы дело шло успешно", en: "so that everything would happen successfully", note: "«дело» (the Work, общее дело) → «everything»"}
  - {id: p3-c01-070, cat: mistranslation, sev: minor, ru: "Если ты выкажешь героическое напряжение сил и мыслей", en: "If you are going to light the heroic strain of your strength and your thoughts", note: "«выкажешь» → «light»; бессмысленное сочетание"}
  - {id: p3-c01-070, cat: mistranslation, sev: minor, ru: "единственный ключ ко всему знанию", en: "the only key to all your knowledge", note: "«ко всему знанию» сужено до «your knowledge»"}
  - {id: p3-c01-071, cat: grammar, sev: major, ru: "Кто не сумеет так жить свой день, для тех знание закрыто", en: "Those who are unable to live like this every day, the knowledge is out of reach for them", note: "анаколуф — фраза грамматически не собрана"}
  - {id: p3-c01-071, cat: mistranslation, sev: major, ru: "несовершенных, но стремящихся к радости совершенства людей и видеть в них каплю огня Вечности", en: "imperfect, but who are striving for joy of knowledge, and who see the sparkle of fire of Eternity in them", note: "«радость совершенства» → «joy of knowledge»; субъект сдвинут: в RU «ты» видишь каплю огня в людях, в EN люди видят; «капля огня» → «sparkle»"}
  - {id: p3-c01-071, cat: omission, sev: minor, ru: "легче и проще, выше и веселее", en: "in an easier, simpler and merrier way", note: "«выше» опущено"}
  - {id: p3-c01-073, cat: terminology, sev: minor, ru: "темные оккультисты", en: "The black occultists", note: "«тёмные» → «black»; сквозной термин, в глоссарий"}
  - {id: p3-c01-073, cat: omission, sev: minor, ru: "язвы, которые они оставляют в сердцах, страшны и разрушительны среди людей невежественных", en: "the wounds which they leave are terrible, and they destroy ignorant people", note: "«в сердцах» опущено; смысл «разрушительны среди невежественных» упрощён"}
  - {id: p3-c01-075, cat: mistranslation, sev: major, ru: "Здесь закаляются сердца тех, кто хочет жить для общего блага", en: "The hearts of those become hardened here, who want to live for the common welfare", note: "«закаляются» (закаляются, крепнут — tempered) → «become hardened» (ожесточаются) — противоположная коннотация"}
  - {id: p3-c01-075, cat: terminology, sev: major, ru: "для мира и радости людей", en: "for the people’s calm and joy", note: "«мир» → «calm» — сквозная замена ключевого понятия (075, 078, 079, 080, 083); см. корпус"}
  - {id: p3-c01-075, cat: fluency, sev: minor, ru: "где куются бойцы для борьбы со злом, с награблением, с разжигающими страстями", en: "where the soldiers for fight against the evil, robbery and burning passions are trained", note: "образ «куются» потерян; «разжигающие страсти» → «burning passions» (сдвиг)"}
  - {id: p3-c01-076, cat: fluency, sev: minor, en: "From this moment on when you’ve entered under the roof … notice the new present", note: "«пойми» → «notice»; конструкция неграмматична"}
  - {id: p3-c01-077, cat: mistranslation, sev: major, ru: "может сдвигать горы", en: "is able to move heaven and earth", note: "«move heaven and earth» = из кожи вон лезть; нужно «move mountains» (есть в английском с тем же смыслом)"}
  - {id: p3-c01-077, cat: fluency, sev: minor, en: "You have the period of entire seven years before you … your private burden … beat the smallest crack through it", note: "порядок слов; «бытовых тягот» → «private burden»"}
  - {id: p3-c01-078, cat: mistranslation, sev: major, ru: "ты каждую встречу сумеешь начать и кончить в радости и мире", en: "you will be able to begin and to start your every meeting calmly and joyfully", note: "«начать и кончить» → «begin and start»; «мир» → «calmly»"}
  - {id: p3-c01-078, cat: fluency, sev: minor, ru: "бодрое пожатие моей руки … в простой доброте", en: "my energetic handshake … with an ordinary kindness", note: "«hearty handshake»; «simple kindness»"}
  - {id: p3-c01-079, cat: mistranslation, sev: major, ru: "начать и кончить каждую из них в мире, милосердии и доброте", en: "to begin and to start each of them calmly, with compassion and kindness", note: "то же «begin and start»; «мир» → «calmly»; «everything what»"}
  - {id: p3-c01-080, cat: terminology, sev: minor, ru: "пути к общему благу и миру", en: "the paths for people to the common welfare and calm", note: "«мир» → «calm» (повтор, см. 075)"}
  - {id: p3-c01-083, cat: terminology, sev: major, ru: "Прими мой привет и мир.", en: "Accept my regards and calm.", note: "формула благословения искажена; «Accept my greeting and peace»; также опущено «зови имя мое «Али»» → «call me by name»"}
  - {id: p3-c01-084.2, cat: fluency, sev: minor, ru: "Огромные пальмы едва вырисовывались волшебными контурами. … какие-то шорохи, точно вздохи", en: "The glamourous contours of the big palms were difficult to see. … some rustles", note: "«волшебными» → «glamourous»; «точно вздохи» опущено; «I stopped feeling to be»"}

  # ───────────── cal-5-verse (p1-c20) ─────────────
  - {id: p1-c20-213, cat: mistranslation, sev: major, ru: "Среди труда, страстей и боли / Избранник я счастливой доли.", en: "Between work, passion and suffering / My destiny is going like this:", note: "смысл строки («я — избранник счастливой доли») утрачен"}
  - {id: p1-c20-213, cat: style, sev: major, ru: "земле/красоте; боли/доли/воли", en: "(без рифмы и размера)", note: "стихотворение передано подстрочником: нет рифмы и ритма"}
  - {id: p1-c20-213, cat: mistranslation, sev: minor, ru: "Моей святыне — красоте / Пою я песнь любви и воли.", en: "I’m weaving my song only for the saint Beauty / From my love, will and power.", note: "«святыня» ≠ «saint»; «воли» (свободы) → «will and power»"}
  - {id: p1-c20-214, cat: mistranslation, sev: minor, ru: "То была не просто песнь, а гимн торжествующей любви", en: "That wasn’t a song anymore, but a hymn of victorious love", note: "«не просто песнь» → «not a song anymore»"}
  - {id: p1-c20-215, cat: mistranslation, sev: minor, ru: "я едва смог, поддерживаемый И., встать … И. был необычно бледен", en: "I could hardly stand up, although I. was holding me … who was pale", note: "«although» переворачивает логику; «необычно» опущено"}
