  - {id: p1-c12-045, cat: mistranslation, sev: major, ru: "так близок был ко мне в эту минуту мой друг, точно я увидел его рядом. Положительно, если бы я спал, то был бы уверен, что вижу его во сне", en: "my friend was so close to me at this moment that I even saw him next to me. Of course, if I was lying, I would think that I was dreaming, but now I was certain that I saw him not in my dream", fix: "my friend felt so near at that moment that it was as if I saw him beside me. Had I been asleep, I should certainly have thought I was seeing him in a dream", note: "«точно увидел» → «even saw» (видение стало фактом) и добавлено «but now I was certain that I saw him not in my dream» — степень достоверности видения перевёрнута"}
  - {id: p1-c12-045, cat: mistranslation, sev: minor, ru: "если бы я спал", en: "if I was lying", fix: "Had I been asleep", note: "«спал» → «lying» (выделено по правилу единицы подсчёта)"}
  - {id: p1-c12-046, cat: mistranslation, sev: major, ru: "Я вынул пилюли", en: "I pulled the pills out of my first-aid kit easily", fix: "I took out the pills", note: "пилюли из «зелёной коробочки Флорентийца» (044), не из «my first-aid kit»: подмена предмета и владельца в сцене, где помощь Флорентийца — суть эпизода (внешнее ревью: minor → major); исправляется удалением слов, блок L2"}
  - {id: p1-c12-046, cat: grammar, sev: minor, en: "I felt such fresh surge of strength … I became merry and laughing, I leant towards", fix: "such a surge of strength … I felt merry and, laughing, leaned towards", note: "артикль; цепочка без союзов"}
  - {id: p1-c12-047, cat: mistranslation, sev: minor, ru: "Точно дивная рука Флорентийца помогла мне … забыл о смерти, таящейся в любом последующем натиске стихии", en: "The wonderful hand of Florentian was as though holding me … I forgot about the death brought by every gust of the wind", fix: "As though Florentian’s wondrous hand were helping me … I forgot the death lurking in every fresh onslaught of the elements", note: "«помогла» → «holding»; «натиск стихии» → «gust of the wind»"}
  - {id: p1-c12-047, cat: grammar, sev: minor, en: "one was still unable to discern where the sky and where the water was", fix: "it was still impossible to tell where the water ended and the sky began", note: "неграмматично"}
  - {id: p1-c12-048, cat: grammar, sev: minor, ru: "Он как бы держал свои руки на его руках. Да и командовал капитан, казалось, под диктовку И.", en: "As though he had put his hand on I.’s hands, and that everybody, including the captain, was obeying to I.’s commands.", fix: "His hands seemed to rest on I.’s hands. And the captain himself seemed to give his orders as if I. were dictating them.", note: "нет главного предложения (as though … and that …), но смысл первой части однозначен; «obeying to». Смысловой сдвиг — отдельной major ниже; эта находка после разделения — minor, чтобы не считать дважды"}
  - {id: p1-c12-048, cat: mistranslation, sev: major, ru: "Да и командовал капитан, казалось, под диктовку И.", en: "and that everybody, including the captain, was obeying to I.’s commands", fix: "And the captain himself seemed to give his orders as if I. were dictating them.", note: "капитан, командующий как бы под диктовку И., заменён всеми, кто подчиняется командам И. — меняется, кто действует (выделено из грамматической находки)"}
  - {id: p1-c12-048, cat: addition, sev: minor, en: "Everybody kept silent and was fighting against the menacing death.", note: "вторая часть — штамп переводчика («menacing death» добавлен и в 051.2)"}
  - {id: p1-c12-049, cat: fluency, sev: minor, en: "One more such heeling over of the ship, and the steamer will fall on its side, so that it would never rise again", fix: "One more list like that and she’ll go over and never right herself", note: "тяжеловесно"}
  - {id: p1-c12-050, cat: typography, sev: minor, en: "but I cried into the very ear of the captain.", fix: "…right into the captain’s ear:", note: "перед репликой точка вместо двоеточия"}
  - {id: p1-c12-051, cat: fluency, sev: minor, ru: "Не ляжет, ни за что не ляжет, выйдем невредимыми.", en: "It will not fall on its side, not for anything, we will survive!", fix: "She won’t go over — never! We’ll come through unharmed!", note: "калька «not for anything»; «невредимыми» → «survive»"}
  - {id: p1-c12-051.2, cat: grammar, sev: minor, ru: "Он только повёл плечами, и это был жест снисхождения мне, мальчишке, не понимающему смерти.", en: "He only shrugged his shoulders, and I understood that like his indulgence to my childish incomprehension of the menacing death.", fix: "He only shrugged — an indulgent gesture towards me, a boy who did not understand death.", note: "«understood that like» вместо «as»; перегруженная именная группа; сказуемое есть, смысл однозначен (внешнее ревью: major → minor)"}
  - {id: p1-c12-051.2, cat: addition, sev: minor, en: "the menacing death", fix: "death", note: "штамп переводчика «menacing death» (ср. 048)"}
  - {id: p1-c12-052, cat: mistranslation, sev: major, ru: "Временами вздымались высоченные зелёные стены воды, с белыми гребнями, точно грозя залить нас сразу со всех сторон и похоронить в пропасти.", en: "As though hollowed out walls of the green water with the peaks of white foam would rise from time to time. They were threatening to flood us from all sides right away", fix: "Now and then towering green walls of water with white crests rose up, as if threatening to engulf us from every side and bury us in the abyss.", note: "«высоченные» → «hollowed out» (выдолбленные) — другой образ стихии"}
  - {id: p1-c12-052, cat: omission, sev: minor, ru: "и похоронить в пропасти … в который уже раз", en: "They were threatening to flood us from all sides right away … so that then we could get upward successfully", note: "опущено"}
  - {id: p1-c12-053, cat: mistranslation, sev: major, ru: "Мне снова почудилась высокая белая фигура Флорентийца, коснувшаяся рук И., который двинул штурвал так, как хотел капитан", en: "The tall and white Florentian’s figure appeared to me again. He touched I.’s hands and then he turned the wheel exactly so as the captain wanted it to", fix: "Again I seemed to see the tall white figure of Florentian touching the hands of I., and I. turned the wheel just as the captain wanted", note: "по EN штурвал поворачивает видение, а не И. — меняется, кто действует; в исправлении И. назван явно"}
  - {id: p1-c12-053, cat: typography, sev: minor, en: "the captain pulled is head into his shoulders", fix: "his head", note: "опечатка"}
  - {id: p1-c12-053, cat: fluency, sev: minor, ru: "пароход послушно повернулся носом вправо", en: "the steamer turned obediently with its front to the right", fix: "the steamer obediently swung her bow to starboard", note: "морская лексика: bow, не front/spike"}
  - {id: p1-c12-054, cat: fluency, sev: minor, en: "pierced through the gigantic mass of the water with its spike … its spike rose upward … didn’t menace to crash us", fix: "cut through the belly of the water-mountain … her bow reared up … no longer threatened to smash us", note: "«spike»; «menace to crash»; «брюхо водяной горы» ослаблено"}
  - {id: p1-c12-055, cat: addition, sev: minor, ru: "но понял, что то был лишь мираж", en: "it was only a mirage, the mirage of my love to him", fix: "but I realized it had been only a mirage", note: "в этом абзаце нашей RU «моей любви» нет; сходная фраза есть в нашей гл. 13 («…в которых исчез мираж моей любви…»); происхождение расхождения не установлено"}

  # ───────────── cal-3-dialogue (p2-c01) ─────────────
  - {id: p2-c01-252, cat: fluency, sev: minor, en: "with the big fireside, bulky sofas and armchairs, upholstered with the blue silk, with the curtains … which were made of the lace of the irreproachable whiteness", fix: "with a huge fireplace, large sofas and armchairs upholstered in blue silk, and spotless white lace curtains at its three wide windows", note: "«fireside»; лишние артикли"}
  - {id: p2-c01-253, cat: grammar, sev: minor, ru: "Удивительно, как красиво в западных домах.", en: "It is amazing how it is beautiful inside of European houses", fix: "How beautiful Western houses are", note: "локальный порядок слов; «у нас на Востоке» → «in our Oriental families»"}
  - {id: p2-c01-254, cat: mistranslation, sev: major, ru: "Ты судишь по моему и этому, единственным западным домам, которые видела. Но когда-нибудь ты научишься различать дома, и их внешняя роскошь не скроет от твоих глаз внутренних язв разложения", en: "You make your decision only according to this and my house, according to the single ones where you’ve been, but some day, my daughter, you will be able to take a look at houses in such a way that an exterior luxury won’t be able to hide its inner wounds of break-up from your eyes.", fix: "But one day, my daughter, you will learn to judge a household, and its outward luxury will not hide from you the inner sores of decay.", note: "«научишься различать дома» (судить о доме за внешним благополучием) → «take a look at houses in such a way» — нравственное различение утрачено"}
  - {id: p2-c01-254, cat: mistranslation, sev: minor, ru: "Ты судишь по моему и этому, единственным западным домам, которые видела.", en: "You make your decision only according to this and my house, according to the single ones where you’ve been", fix: "You judge by mine and this one — the only Western houses you have seen.", note: "«судишь» → «make your decision»; «западным» опущено"}
  - {id: p2-c01-254, cat: mistranslation, sev: minor, ru: "внутренних язв разложения", en: "its inner wounds of break-up", fix: "the inner sores of decay", note: "«разложение» → «break-up» (распад, разрыв)"}
  - {id: p2-c01-255, cat: grammar, sev: minor, en: "the pastor came in by greeting his guests", fix: "the pastor came in, greeting his unexpected guests", note: "«by + -ing» вместо деепричастия (по корпусу — систематически)"}
  - {id: p2-c01-255, cat: omission, sev: minor, ru: "приветствуя своих неожиданных гостей и благодаря их за честь, оказанную его дому", en: "greeting his guests and thanking them for the honour given to him with this visit", fix: "greeting his unexpected guests and thanking them for the honour they had done his house", note: "«неожиданных» опущено; «оказанную его дому» → «given to him with this visit»"}
  - {id: p2-c01-256, cat: mistranslation, sev: major, ru: "А жена будет посаженной матерью, как полагается по здешним обычаям.", en: "while my wife would become the matron of honour according to our custom", fix: "and my wife will stand in for the bride’s mother, as local custom requires", note: "«посаженная мать» (заменяет мать невесты) ≠ «matron of honour» (замужняя подружка невесты) — подмена роли"}
  - {id: p2-c01-256, cat: fluency, sev: minor, en: "the pastor uttered pleasingly … I’ve been telling about the young bride to my wife … the pastor was telling them by looking at Nal", fix: "said the pastor cordially … I have talked so much to my wife and daughters about the young bride … said the pastor, looking at Nal", note: "«pleasingly»; кальки"}
  - {id: p2-c01-257, cat: grammar, sev: minor, en: "there wouldn’t be a single woman in my wedding", fix: "at my wedding", note: "предлог"}
  - {id: p2-c01-258, cat: fluency, sev: minor, ru: "Разделённые на пробор волнистые волосы, свитые у шеи в тугие косы", en: "Her distinct, curly, copper and parted hair were unusually luxuriant, it was done up in two wiry plaits behind her back", fix: "Her wavy hair, parted in the middle and twisted into tight plaits at the nape, was magnificent", note: "«hair were» (по корпусу редко); «тугие» → «wiry»; «у шеи» → «behind her back»"}
  - {id: p2-c01-259, cat: grammar, sev: minor, en: "she’s even an exact her copy", fix: "her exact copy", note: "порядок слов"}
  - {id: p2-c01-259, cat: name, sev: minor, ru: "Уодсворд; Алиса", en: "Wodsword; Alyssa", note: "транслитерации имён — решить в глоссарии (Wadsworth? Alice?)"}
  - {id: p2-c01-259.2, cat: source-divergence, evidence: search-weak, ru: "Девушки и мать отшучивались.", en: "…He told them about his youngest daughter that today she had decided to run to the bride’s house secretly…", note: "эпизода нет ни в одной из наших частей (проверено по полному тексту); поиск возвращает близкую русскую фразу только в пересказе поисковика, первоисточник не открыт — доказательность слабая"}
  - {id: p2-c01-259.2, cat: fluency, sev: minor, en: "they also were getting out in jest of such a presentation", fix: "The girls and their mother laughed it off", note: "калька"}
  - {id: p2-c01-260, cat: fluency, sev: minor, ru: "заразительно засмеялась младшая", en: "the girl was laughing infectiously … the beauty from oversea … exceeds everything what one could imagine", fix: "laughed the younger girl … the overseas beauty … exceeds everything one could imagine", note: "«младшая» потеряно; «overseas»; «everything what»"}
  - {id: p2-c01-261, cat: mistranslation, sev: major, ru: "Какая-то радостная доброта Алисы покоряла каждого.", en: "Alyssa’s kindness used to enslave everybody, while the atmosphere of joy that was covering her used to create an ordinary relationship with the girl.", fix: "Alyssa’s joyful kindness won everyone over.", note: "«покоряла» (очаровывала) → «enslave» (порабощала) — обратная коннотация"}
  - {id: p2-c01-261, cat: fluency, sev: minor, ru: "Какая-то радостная", en: "while the atmosphere of joy that was covering her used to create an ordinary relationship with the girl", fix: "(входит в «joyful kindness»)", note: "раздробленная передача «радостная»; «used to» — привычка в прошлом"}
  - {id: p2-c01-261, cat: mistranslation, sev: major, ru: "Она казалась остовом семьи.", en: "It seemed that she was that little link which was connecting their family.", fix: "She seemed the mainstay of the family.", note: "«остов» (каркас, опора) → «little link» (маленькое звено): масштаб роли Алисы в семье перевёрнут (внешнее ревью: minor → major); исправляется заменой, без перестройки абзаца"}
  - {id: p2-c01-261, cat: mistranslation, sev: minor, ru: "принимающих приятных, но чужих людей", en: "accepting kind, but strange people", fix: "receiving pleasant strangers", note: "«чужих» = посторонних"}
  - {id: p2-c01-261, cat: addition, sev: minor, edition_candidate: true, en: "having clapped her hands like a child, she was talking", note: "хлопка в ладоши и речи Алисы в этом абзаце нашей RU нет («disobeyed the comb» передаёт «выбивавшиеся» пряди — не добавление)"}
  - {id: p2-c01-263, cat: name, sev: minor, ru: "Флорентийца", en: "Florentian", note: "решить в глоссарии (вариант: the Florentine) — D4"}
  - {id: p2-c01-263, cat: fluency, sev: minor, ru: "с неподражаемым юмором кланялся девушке и представлял ей Николая лорд Бенедикт", en: "lord Benedict was bowing to the girl with the unique humour in his eyes and he introduced Nikolay to her", fix: "said Lord Benedict, bowing to the girl with inimitable humour and introducing Nikolay to her", note: "«unique» ≠ «неподражаемый»; добавлено «in his eyes»; разнобой времён; «lord» со строчной"}
  - {id: p2-c01-264, cat: mistranslation, sev: major, ru: "Девушка, как и Наль, почти ребёнок", en: "Alyssa who was still as childish as Nal", fix: "The girl, who like Nal was scarcely more than a child,", note: "«почти ребёнок» (возраст) → «childish» (ребячливая): отрицательная характеристика обеих девушек, которой у рассказчика нет (внешнее ревью, пропуск)"}
  - {id: p2-c01-264, cat: addition, sev: minor, ru: "низко присела в реверансе", en: "made a deep curtsy to both men", fix: "made a deep curtsy", note: "«to both men» нет в RU"}
  - {id: p2-c01-265, cat: fluency, sev: minor, ru: "по-моему", en: "According to me", fix: "In my opinion / I think", note: "по корпусу единичный случай"}
  - {id: p2-c01-266, cat: fluency, sev: minor, ru: "Не знаю, для кого из нас ваши слова комплимент, но благодарим мы за него оба, — под общий смех ответил Флорентиец.", en: "“I don’t know to whom your words are a compliment, but both of us say thank you for them,” Florentian answered her, while everybody was laughing.", fix: "“I’m not sure which of us you are complimenting, but we both thank you,” said Florentian amid general laughter.", note: "смысл верен, но реплика звучит как перевод и теряет лёгкость шутки; ремарка тяжеловесна (внешнее ревью: L0 → L2)"}
  - {id: p2-c01-267, cat: addition, sev: minor, ru: "У нас, по старинному обычаю, чай пьют в столовой.", en: "According to the old custom of our forefathers, we drink the tea not in the sitting-room, but in the dining-room.", fix: "By old custom we take tea in the dining-room.", note: "лишние «of our forefathers», «not in the sitting-room»"}
  - {id: p2-c01-268, cat: grammar, sev: minor, en: "to be the bridesmaids in the wedding of his daughter tomorrow", fix: "to be his daughter’s bridesmaids at tomorrow’s wedding", note: "предлог"}
  - {id: p2-c01-269, cat: mistranslation, sev: major, ru: "всё самое высокое и благородное, что выходит из нашего дома, всегда принадлежит ему", en: "Everything what is the most honourable and generous always belongs to him", fix: "But then, all the finest and noblest things that come from our house are always his doing.", note: "утрачено «что выходит из нашего дома»: авторство поступков и замыслов дома превратилось во «владение всем благородным вообще» — в ответ на вопрос, чья это идея (внешнее ревью: minor → major); «everything what»"}
  - {id: p2-c01-270, cat: fluency, sev: minor, ru: "У вас в доме как бы две партии", en: "As though two parties exist in your home", fix: "So there are, as it were, two parties in your house", note: "неестественный порядок"}
  - {id: p2-c01-271, cat: mistranslation, sev: major, ru: "Это верно до некоторой степени, потому что мы все очень дружны.", en: "On a certain scale – yes, although we all are very friendly.", fix: "That is true to some extent, because we are all very close.", note: "«потому что» → «although» — обратная связка"}

  # ───────────── cal-4-teaching (p3-c01) ─────────────
  - {id: p3-c01-066.2, cat: terminology, sev: minor, ru: "условного разъединения", en: "conditional separation", fix: "apparent separation", note: "«условный» здесь = мнимый, внешний"}
  - {id: p3-c01-066.2, cat: mistranslation, sev: major, ru: "чье сознание раскрыло человеку его живую Вечность, которую он в себе носит", en: "whose consciousness has comprehended the living Eternity within themselves", fix: "whose consciousness has revealed to man the living Eternity he bears within him", note: "«раскрыло человеку» → «comprehended» (постигло): другая роль сознания; «которую он в себе носит» сжато (внешнее ревью, пропуск)"}
  - {id: p3-c01-067, cat: fluency, sev: minor, ru: "равноправным членом моей семьи", en: "as the member of my family enjoying equal rights", fix: "as a full member of my family", note: "калька"}
  - {id: p3-c01-067, cat: terminology, sev: major, ru: "идущие путем труда и совершенствования", en: "walking the path of their development and work", fix: "treading the path of labour and self-perfection", note: "«совершенствование» (сквозное понятие учения) → «development»"}
  - {id: p3-c01-068, cat: mistranslation, sev: major, ru: "Ты будешь владеть силами в себе и вовне.", en: "You are going to control your inner and your outer powers.", fix: "You will command the forces within you and outside you.", note: "власть над силами в себе и во внешнем мире сужена до «твоих внешних сил»; «within you and without» тоже верно, но архаичнее"}
  - {id: p3-c01-068, cat: mistranslation, sev: major, ru: "И. поведет тебя, постоянно помогая развитию твоих психических сил, к высшей ступени знания.", en: "I. is going to lead you by always helping you to develop your psychic powers into the highest levels of knowledge.", fix: "I. will lead you to the highest level of knowledge, constantly helping you to develop your psychic powers.", note: "«develop your psychic powers into … knowledge» — способности превращаются в уровни знания; в RU к высшей ступени ведут ученика (внешнее ревью, пропуск)"}
  - {id: p3-c01-068, cat: name, sev: minor, ru: "сэра Уоми", en: "sir Vomi", note: "транслитерация сомнительна, но по корпусу последовательна (257/83/34) — вопрос глоссария; «sir» со строчной"}
  - {id: p3-c01-068, cat: register, sev: minor, ru: "И. поведет тебя … Ты будешь владеть", en: "I. is going to lead you … You are going to control", fix: "I. will lead you … You will command", note: "разговорное «be going to» в возвышенном письме (также 070)"}
  - {id: p3-c01-068, cat: grammar, sev: minor, en: "You were endowed more than many of them", fix: "More has been given to you than to many of them", note: ""}
  - {id: p3-c01-069, cat: mistranslation, sev: minor, ru: "чтобы дело шло успешно", en: "so that everything would happen successfully", fix: "for the Work to go well", note: "«дело» (общее дело) → «everything»"}
  - {id: p3-c01-070, cat: mistranslation, sev: major, ru: "Если ты выкажешь героическое напряжение сил и мыслей", en: "If you are going to light the heroic strain of your strength and your thoughts", fix: "If you make a heroic effort of strength and thought", note: "условие поучения передано бессмысленным сочетанием"}
  - {id: p3-c01-070, cat: mistranslation, sev: minor, ru: "единственный ключ ко всему знанию", en: "the only key to all your knowledge", fix: "the only key to all knowledge", note: "сужение"}
  - {id: p3-c01-071, cat: grammar, sev: minor, ru: "Кто не сумеет так жить свой день, для тех знание закрыто", en: "Those who are unable to live like this every day, the knowledge is out of reach for them", fix: "Knowledge remains closed to those who cannot live each day in this way", note: "вынесенная тема с местоименным повтором и лишний артикль; главное предложение есть, смысл однозначен (внешнее ревью: major → minor)"}
  - {id: p3-c01-071, cat: mistranslation, sev: critical, ru: "Можно жить среди таких же, как ты сам, несовершенных … людей и видеть в них каплю огня Вечности.", en: "One can live among the same people like you are, imperfect, … and who see the sparkle of fire of Eternity in them.", fix: "One can live among people as imperfect as yourself, yet striving towards the joy of perfection, and see in them a drop of the fire of Eternity.", note: "центральная мысль отрывка: в RU «ты» видишь в других каплю огня Вечности, в EN её видят сами люди (who see)"}
  - {id: p3-c01-071, cat: mistranslation, sev: major, ru: "стремящихся к радости совершенства", en: "striving for joy of knowledge", fix: "striving towards the joy of perfection", note: "«совершенство» → «knowledge» — подмена понятия (выделено из critical по правилу единицы подсчёта)"}
  - {id: p3-c01-071, cat: mistranslation, sev: major, ru: "а принести ей помощь, чтобы она могла легче и проще, выше и веселее превращаться из капли в костер", en: "you will try to help him, so that he would turn from the sparkle into the bonfire", fix: "but to help it, so that it may grow from a drop into a blaze", note: "«ей», «она» — капля огня; в EN в костёр превращается человек — меняется носитель образа (оба внешних ревьюера, пропуск)"}
  - {id: p3-c01-071, cat: omission, sev: minor, ru: "легче и проще, выше и веселее", en: "in an easier, simpler and merrier way", fix: "more easily and simply, higher and more joyfully", note: "«выше» опущено"}
  - {id: p3-c01-073, cat: terminology, sev: minor, ru: "темные оккультисты", en: "The black occultists", fix: "dark occultists", note: "сквозной термин — в глоссарий"}
  - {id: p3-c01-073, cat: mistranslation, sev: minor, ru: "язвы, которые они оставляют в сердцах, страшны и разрушительны среди людей невежественных", en: "the wounds which they leave are terrible, and they destroy ignorant people", fix: "the sores they leave in hearts are terrible and destructive among the ignorant", note: "«в сердцах» опущено; сдвиг субъекта"}
  - {id: p3-c01-074, cat: terminology, sev: major, ru: "сжигая в человеке волю к добру своим тяжелым гипнозом", en: "they burn down the will for kindness within man with their hypnosis", fix: "burning out in man the will to do good with their oppressive hypnosis", note: "«добро» как нравственная категория → «kindness» (смешано с «доброта» 078–079); «will to good» или «will to do good» — решить в глоссарии"}
  - {id: p3-c01-074, cat: omission, sev: minor, ru: "своим тяжелым гипнозом", en: "with their hypnosis", fix: "with their oppressive hypnosis", note: "«тяжелым» опущено (выделено по правилу единицы подсчёта)"}
  - {id: p3-c01-075, cat: mistranslation, sev: critical, ru: "Здесь закаляются сердца тех, кто хочет жить для общего блага", en: "The hearts of those become hardened here, who want to live for the common welfare", fix: "Here the hearts of those who wish to live for the common good are tempered", note: "«закаляются» (крепнут) → «become hardened» (ожесточаются): ключевое утверждение об Общине получает противоположный смысл"}
  - {id: p3-c01-075, cat: terminology, sev: major, ru: "для мира и радости людей", en: "for the people’s calm and joy", fix: "for the peace and joy of people", note: "«мир» → «calm» (075, 078, 079, 080, 083)"}
  - {id: p3-c01-075, cat: fluency, sev: minor, ru: "где куются бойцы для борьбы со злом, с награблением, с разжигающими страстями", en: "where the soldiers for fight against the evil, robbery and burning passions are trained", fix: "where fighters are forged for the struggle against evil, against plunder and inflaming passions", note: "образ «куются» потерян"}
  - {id: p3-c01-076, cat: fluency, sev: minor, en: "From this moment on when you’ve entered under the roof … notice the new present", fix: "From the moment you entered under the roof of my Community, grasp the new order of things and understand in it the new gift", note: "«пойми» → «notice»"}
  - {id: p3-c01-077, cat: mistranslation, sev: major, ru: "может сдвигать горы", en: "is able to move heaven and earth", fix: "can move mountains", note: "«move heaven and earth» = приложить все усилия — другой смысл"}
  - {id: p3-c01-077, cat: fluency, sev: minor, en: "You have the period of entire seven years before you … your private burden … beat the smallest crack through it", fix: "Before you lies a period of seven whole years … everyday burdens … make a breach in it", note: ""}
  - {id: p3-c01-077, cat: terminology, sev: minor, ru: "твое Я, освобожденное от страстей", en: "your I which is free from passions", fix: "your self, freed from passions (предварительно)", note: "«Я» — вопрос ядра глоссария: self / Self / higher self нельзя выбрать без установленного смысла (внешнее ревью)"}
  - {id: p3-c01-078, cat: mistranslation, sev: major, ru: "ты каждую встречу сумеешь начать и кончить", en: "you will be able to begin and to start your every meeting", fix: "you will be able to begin and end every meeting", note: "«кончить» → «start»; major, не critical: наставление в целом понятно, ложного утверждения нет"}
  - {id: p3-c01-078, cat: terminology, sev: major, ru: "в радости и мире", en: "calmly and joyfully", fix: "in joy and peace", note: "«мир» → «calm»"}
  - {id: p3-c01-078, cat: fluency, sev: minor, ru: "бодрое пожатие моей руки … в простой доброте", en: "my energetic handshake … with an ordinary kindness", fix: "a hearty handshake … in simple kindness", note: ""}
  - {id: p3-c01-079, cat: mistranslation, sev: major, ru: "начать и кончить каждую из них", en: "to begin and to start each of them", fix: "to begin and end each of them", note: "то же"}
  - {id: p3-c01-079, cat: terminology, sev: major, ru: "в мире, милосердии и доброте", en: "calmly, with compassion and kindness", fix: "in peace, mercy and kindness", note: "«мир» → «calm»"}
  - {id: p3-c01-079, cat: grammar, sev: minor, en: "everything what man must achieve", fix: "all that a man must achieve", note: "«everything what»"}
  - {id: p3-c01-080, cat: terminology, sev: major, ru: "пути к общему благу и миру", en: "the paths for people to the common welfare and calm", fix: "paths to the common good and to peace", note: "«мир» → «calm»"}
  - {id: p3-c01-081, cat: mistranslation, sev: minor, ru: "каждому его момент современности", en: "everybody has his own time", fix: "to each his own moment of the present", note: "оттенок «момент современности» утрачен"}
  - {id: p3-c01-083, cat: terminology, sev: major, ru: "Прими мой привет и мир.", en: "Accept my regards and calm.", fix: "Accept my greeting and my peace.", note: "формула благословения; «мир» → «calm»; major, не critical: приветствие передано, искажена формула"}
  - {id: p3-c01-083, cat: omission, sev: minor, ru: "зови имя мое «Али»", en: "call me by name", fix: "call my name, “Ali”", note: "имя опущено"}
  - {id: p3-c01-084.2, cat: fluency, sev: minor, ru: "Огромные пальмы едва вырисовывались волшебными контурами. … какие-то шорохи, точно вздохи", en: "The glamourous contours of the big palms were difficult to see. … some rustles", fix: "The huge palms were barely outlined, magical silhouettes … rustlings like sighs", note: "«волшебными» → «glamourous»; «точно вздохи» опущено"}

  # ───────────── cal-5-verse (p1-c20) ─────────────
  - {id: p1-c20-213, cat: mistranslation, sev: major, ru: "Среди труда, страстей и боли / Избранник я счастливой доли.", en: "Between work, passion and suffering / My destiny is going like this:", note: "строка смысла утрачена"}
  - {id: p1-c20-213, cat: style, sev: major, ru: "земле/красоте; боли/доли/воли", en: "(без рифмы и размера)", note: "неудачный нерифмованный перевод: нет ни рифмы, ни ритма, ни иного песенного решения, разговорное «going like this»; серьёзность — по совокупности потерь (отсутствие рифмы само по себе major не делает)"}
  - {id: p1-c20-213, cat: mistranslation, sev: major, ru: "Моей святыне — красоте / Пою я песнь любви и воли.", en: "I’m weaving my song only for the saint Beauty / From my love, will and power.", note: "две строки перестроены: «моей святыне» → «the saint», «пою» → «weaving», песнь любви и воли → песня «из» любви, воли и силы; добавлены only, power (оба внешних ревьюера: minor → major). «Воля» (will / freedom) — вопрос глоссария"}
  - {id: p1-c20-214, cat: mistranslation, sev: minor, ru: "То была не просто песнь, а гимн торжествующей любви", en: "That wasn’t a song anymore, but a hymn of victorious love", fix: "It was not merely a song but a hymn of triumphant love", note: ""}
  - {id: p1-c20-215, cat: mistranslation, sev: minor, ru: "я едва смог, поддерживаемый И., встать", en: "I could hardly stand up, although I. was holding me", fix: "With I.’s support, I could barely get to my feet", note: "«although» лишне толкует связь частей, но уступка совместима с RU (даже с опорой встать трудно); ревьюеры разошлись — minor"}
  - {id: p1-c20-215, cat: omission, sev: minor, ru: "И. был необычно бледен", en: "who was pale", fix: "unusually pale", note: "«необычно» опущено"}
  - {id: p1-c20-215.2, cat: typography, sev: minor, en: "he said to the captain tenderly.", fix: "he said tenderly to the captain:", note: "точка вместо двоеточия перед репликой"}
