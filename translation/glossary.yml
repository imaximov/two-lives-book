- id: knyaz#title
  ru: князь
  sense: русский (и в романе — также восточный) княжеский титул; в тексте и как обозначение лица («князь»), и как обращение
  distinguish: 'не путать с prints#royal («принц»: Ананда — «принц», p1-c19-066) и с герцогом («приветствовал её, как герцогиню»
    p1-c16-024 → like a duchess — верно; «манеры герцога» p2-c10-080). «Великий князь» — отдельная запись velikiy-knyaz.'
  ru_forms: [князь, князя, князю, князем, князе, князья, князей, князьям, князьях]
  tier: core
  first_seen: p1-c09-067
  counts: {p1: 317, p2: 31, p3: 3}
  note: 'Два лица: (1) безымянный князь — муж княгини на пароходе и в Константинополе (p1-c15 … p1-c26; «несчастным мужем
    злющей княгини» p1-c15-059, «князя» p1-c15-071); (2) князь Сенжер — дядя Ананды (p2-c16-032). Для обоих — prince. Отчёт
    §5, §6.3 п.7: duke — систематическая ошибка (duke = герцог). По корпусу число duke совпадает с числом «князь» во всех
    частях.'
  evidence:
  - {id: p1-c15-071, ru: 'я бы грубо отвернулся от внушавшего отвращение, князя', en_legacy: I probably would only turn away
      rudely from the duke who was exciting disgust}
  - {id: p1-c15-072, ru: Князь поднял своё залитое слезами лицо, en_legacy: The duke raised his face which was wet because
      of the tears}
  - {id: p2-c16-032, ru: 'А это дядя Ананды, князь Сенжер.', en_legacy: 'and here’s Ananda’s uncle, duke Saintger.'}
  - {id: p1-c25-165, ru: снова остановил князя Ананда, en_legacy: Ananda stopped the duke once again}
  en:
    term: prince; перед именем с прописной — Prince Saintger (форма имени — по characters.yml, senzher); в обращении — Prince
    legacy: duke — 317 / 31 / 3 (duke 333, Duke 16, dukes 1 во всём тексте; из них «duke Saintger» 21); prince для «князь»
      — 0 (в связях)
    avoid: [duke]
    status: proposed
  question: 'После замены duke → prince «князь» и «принц» (Ананда) совпадут в английском. Рекомендация: так и оставить (в
    английском это одно слово), различать контекстом; для Ананды — «a prince» со строчной (он не носит титула перед именем).
    Сверить с владельцем.'

