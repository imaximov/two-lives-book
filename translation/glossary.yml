- id: address#ty-vy
  ru: ты / вы
  sense: различие близкого и вежливого обращения; в романе важно для отношений (Али к Левушке на «вы» в p1-c01, на «ты» в
    письме p3-c01; «Говори мне «ты»» p3-c04-212)
  tier: core
  first_seen: p1-c01-013
  counts: {p1: 2, p2: 3, p3: 1}
  note: 'Старый EN различие не передаёт: thou/thee/thy — 0 во всём корпусе. Там, где RU прямо говорит о «ты/вы», старый EN
    либо теряет место (p1-c15-112), либо заменяет смысл (p1-c09-118), либо даёт бессмыслицу «say “You”» (p2-c17-081, p3-c04-212).
    В p1-c01: купец → Левушке «ты» (фамильярность торговца, 014, 018, 025, 031), Левушка → купцу «вы» (013, 019, 031); Николай
    ↔ Левушка «ты»; Николай → Махмуду «вы» (093); Махмуд → Левушке «вы» (095); Али → Левушке «вы» (058, 126, 131, 135). Решение
    §9.5: в EN — тоном и лексикой; thee/thou не вводить (§6.3 п.8).'
  evidence:
  - {id: p2-c17-081, ru: '— Вы, Алиса, всё ещё говорите Лизе «вы», — вмешался в их разговор Джемс', en_legacy: '“Alyssa, you
      still say “You” to Lisa,” James … interfered their conversation.'}
  - {id: p3-c04-212, ru: 'Говори мне «ты» с этой минуты. Те, кто имел счастье стоять рядом в этой комнате, не могут иметь
      условного предрассудка «Вы».', en_legacy: From this moment on tell me “you”. Those who had the happiness to stand one
      next to another in this room may not have the conditional address “You”.}
  - {id: p1-c09-118, ru: 'Если вы говорите, — она сделала сильное ударение на «вы», — что она уедет, я вам верю.', en_legacy: 'If
      you told me that she would leave,” she put a strong stress on the word “she”, “then I believe you.'}
  - {id: p1-c15-112, ru: 'Ведь вы выпили со мной "на брудершафт", а сейчас говорите мне «вы».', en_legacy: 'You were drinking
      brotherhood with me, so does your love to me look like those flowers …', note: упрёк за «вы» опущен}
  en:
    term: 'без thou/thee; различие — тоном, формами обращения (my friend / Sir), сокращениями; в метаязыковых местах — перифраз:
      «you still address Liza so formally», «From now on, speak to me as a friend — no formalities», «she laid heavy stress
      on the word ‘you’»'
    legacy: не передаётся (thou 0); в 4 метаязыковых местах — потеря или бессмыслица
    avoid: [thou, thee, say “You” to]
    status: proposed
  question: 'Для p3-c04-212 и p2-c17-081 утвердить перифраз (formally / as a friend) вместо буквального «you/You». Рекомендация:
    перифраз, в стайлгайд.'

