- id: lord#title
  ru: лорд
  sense: британский титул; главное употребление — «лорд Бенедикт» (имя, под которым выступает Флорентиец), также лорд Мильдрей,
    лорд Уодсворд и др.
  distinguish: '«английский лорд» как нарицательное (p1-c03-052 «я и в самом деле английский лорд») — со строчной: an English
    lord. Не путать с Lord = Бог: «Господи» в старом EN 23 раза → Lord (см. moy-bog#interjection).'
  ru_forms: [лорд, лорда, лорду, лордом, лорде, лорды, лордов, лордами]
  tier: core
  first_seen: p1-c03-052
  counts: {p1: 32, p2: 720, p3: 5}
  note: 'Отчёт §6.3 п.7: Lord с прописной в титуле. По корпусу старый EN пишет «lord Benedict» со строчной в 12 / 504 / 0
    случаях против «Lord Benedict» 3 / 89 / 1 (из них в середине фразы — только 0 / 40 / 0 → прописная в основном от начала
    предложения). Кроме того, лишний артикль: «the lord» 9 / 199 / 2 (чаще всего «the lord Benedict’s voice»).'
  evidence:
  - {id: p1-c03-054, ru: 'Представляйте меня лордом Бенедиктом, а сами зовите меня Флорентийцем', en_legacy: 'Among the strangers
      I am the lord Benedict, but you can call me Florentian'}
  - {id: p2-c01-256, ru: 'свойственной только людям истинной культуры, лорд Бенедикт', en_legacy: 'But now, lord Benedict,
      having heard about your visit of courtesy'}
  - {id: p2-c01-263, ru: представлял ей Николая лорд Бенедикт, en_legacy: lord Benedict was bowing to the girl … and he introduced
      Nikolay to her}
  - {id: p2-c16-032, ru: '— Встань, друг Алиса, — раздался голос лорда Бенедикта.', en_legacy: '“Alyssa, stand up,” the lord
      Benedict’s voice was heard.'}
  en:
    term: Lord + имя без артикля (Lord Benedict, Lord Mildrey; Lord Benedict’s voice); нарицательное — a lord
