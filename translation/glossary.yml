# Глоссарий «Две жизни» (TRANSLATION-PROCESS §9, DEC-002, DEC-011, DEC-015, DEC-028).
# Этап 3 — ЯДРО: сквозные понятия учения, формулы, правила, титулы и обращения, а также термины пилотной главы p1-c01
# и отрывков калибровочного набора. Дальше глоссарий растёт поглавно (§9.2 п.7).
#
# Статусы: все варианты сейчас `proposed`. `core` утверждает только владелец; `secondary` — автоматически, если хотя бы
# один внешний ревьюер явно ответил `agree` и никто не ответил `object` (DEC-015). Пока не утверждено — действует
# `proposed` («первый вариант держится», §9.2 п.2). PL-варианты — на этапе 10 (поле `pl` пока отсутствует).
#
# Поля: id (`слово#значение` для многозначных), ru, sense, distinguish (как отличить от других значений, с ID),
# ru_forms, tier, first_seen, counts (вхождения в RU по частям; что именно считалось — counts_what), note, evidence
# (цитаты с ID: ru, en_legacy — старый перевод этого места), en.term (предложение), en.legacy (варианты старого EN с
# частотами), en.avoid, en.status, question (нужно решение владельца: варианты, доводы, рекомендация).
#
# Источник чисел и цитат: tools/glossary/corpus.py (автовыравнивание всех глав; цитаты EN сверены глазами),
# PDF и epub напрямую. Числа старого EN — оценки по выровненным окнам («≈») или сырые совпадения; для Vol3 — нижняя
# оценка. Записи с несколькими ru через « / » — группы реалий одного эпизода (secondary); при поглавном росте
# разбиваются, если слово встретится снова. Заметки исследования — translation/analysis/glossary-core-notes.md.
# Проверка: python -m tools.glossary.check
#
# Правила по итогам внутреннего ревью ядра (translation/reviews/en/glossary-core/resolution.md): в en.term / en.name —
# ровно один рабочий вариант (альтернативы — в question/note, контекстный выбор — явным критерием в note); по умолчанию —
# вариант старого EN, если он не ошибочен (§9.2 п.6); имена в примерах — только по characters.yml; first_seen — первое
# вхождение именно этого значения.
# Открытые вопросы стайлгайда (этап 4), всплывшие при ревью ядра: оксфордская (серийная) запятая — отдельный вопрос, DEC-024
# касается только орфографии -ize; торжественное labour для «труда» (trud); he/his при первых упоминаниях Сандры (characters.yml,
# sandra-santanaida); точка после Il. в конце предложения и шрифт с различимыми I/l (illofillion).

entries:

