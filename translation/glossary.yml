- id: ledi#title
  ru: леди
  sense: британский титул женщины; у Антаровой — «леди» + ЛИЧНОЕ имя (леди Катарина, леди Цецилия, леди Бердран, леди Алиса)
  ru_forms: [леди]
  tier: core
  first_seen: p2-c01-259
  counts: {p1: 0, p2: 230, p3: 59}
  note: '«Леди Катарина Уодсворд» — жена пастора; по британскому этикету так называли бы только дочь пэра, но это авторское
    употребление — сохраняем как в RU (DEC-028: решаем по тексту романа, а не по внешним нормам). Старый EN: lady + имя 1
    / 161 / 45, Lady + имя 0 / 57 / 12. «Миледи» (обращение служанки, p2-c03-044/045) → my lady (в речи допустимо m’lady):
    написание milady у английского читателя связано с Дюма и французским колоритом; старый EN — milady.'
  evidence:
  - {id: p2-c01-259, ru: '— Леди Катарина Уодсворд, — сказал пастор, подводя жену к Наль.', en_legacy: '“This is my wife,
      lady Katherine Wodsword,” the pastor uttered'}
  - {id: p2-c03-045, ru: '— Не называйте меня «миледи», я такая же слуга, как и вы', en_legacy: '“Don’t call me milady, I’m
      the same servant as you are”'}
  en:
    term: Lady + имя (Lady Katherine Wodsword — фамилия по characters.yml); обращение служанки — my lady
    legacy: lady Katherine 73, lady Cecilia 60, lady Berdran 44 … (строчная); Lady + имя 69
    avoid: [lady + имя со строчной, milady]
    status: proposed
  question: 'Сохранить авторское «Lady + личное имя» для жены пастора (не «править» по этикету на Lady Wodsword)? Рекомендация:
    сохранить.'

