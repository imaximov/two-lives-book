- id: sinyor#title
  ru: синьор / синьора
  sense: итальянское обращение/титул (синьоры Гальдони, синьор Бонда, синьора Беата, синьор Седелани; шутливо — «синьор Ананда»)
  ru_forms: [синьор, синьора, синьору, синьорам, синьоры, синьоре, синьором]
  tier: core
  first_seen: p1-c14-039
  counts: {p1: 9, p2: 26, p3: 15}
  note: 'RU везде даёт итальянскую форму «синьор», не испанскую «сеньор». Старый EN в части I — signor/signora(s) (10), а
    в частях II–III — испанские senor/senora (22 и 14: senor Bonda 14, senora Beata 8, senora Sedelani 4 …). Прямого указания
    на испанское происхождение этих лиц в тексте нет (поиск «испан*» рядом с Бонда/Седелани — 0), так что senor противоречит
    форме RU. Итальянское мн. ч. signore английский читатель не узнает и прочтёт как мужское ед. ч. («сударь»).'
  evidence:
  - {id: p1-c15-150, ru: 'кроме Жанны, двух синьор итальянок и семьи греков', en_legacy: 'not only Joan, both signoras Italians
