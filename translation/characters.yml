    I. Риски Il. (языковое ревью), которые надо проверить до утверждения: (1) в рубленых шрифтах (веб по умолчанию, многие
    читалки) заглавная I и строчная l одинаковы — Il. выглядит как «ll.» или «II.»; (2) при чтении про себя «Doctor Il.»,
    «Teacher Il.» легко слышатся как «Doctor Ill» («больной доктор») — нежелательно для героя-врача; (3) на конце предложения
    точка сокращения сливается с точкой предложения (правило стайлгайда: одна точка, «…with Il.»). Поэтому до утверждения
    Il. — проверить в шрифтах пробной сборки сайта и EPUB (этап 4) и выбрать шрифт с засечками, где I и l различимы; если
    владелец выберет I., в стайлгайде нужен приём перестройки фраз рядом с местоимением I.'

