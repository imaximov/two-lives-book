  - {id: p2-c11-200, ru: 'Ну, давайте руку, англичанин-спортсмен, и прыгайте.'}
  en:
    name: Tendl
    legacy: Tendly — Vol2 215 (200 + 15 ’s)
    avoid: [Tendly]
    status: proposed
  question: 'ОБЩИЙ ВОПРОС О ПРИНЦИПЕ (внутреннее ревью, t17): когда буквенное несоответствие старого EN форме RU — основание
    для правки? Сейчас сходные случаи решены по-разному: Tendly → правка, Obersvode (RU «-своуд») → оставлен. Затронуты: Tendly
    (Тендль), Obersvode (Оберсвоуд), Vomi (Уоми), Dartran (Дартан), Rettedly (Ретедли), Oldenkot (Ольденкотт), Aninov (Аннинов),
    Apolon (Аполлон), Vasilyon (Василион), Ilofilion (Иллофиллион). Варианты: (а) буквенный — любое несовпадение с буквами
    RU — ошибка: Tendl, Obersvoud, Uomi, Dartan, Retedly, Oldenkott, Anninov, Apollon, Vasilion; минус — Tendl по-английски
    непроизносимо (фамилия не может кончаться на -ndl), Obersvoud читается [-vaʊd]; (б) звуковой — вариант старого EN ошибочен,
    только если английское чтение даёт другой звук, чем RU (лишний, потерянный или другой звук: Tendly — лишнее «-и», Dartran
    — лишнее «р», Vomi — «В» вместо «У», Vasilyon — стянутый слог); удвоения и английская орфография того же звука — не ошибка
    (§9.2 п.6): остаются Obersvode, Oldenkot, Aninov, Apolon, Rettedly; (в) смешанный — звук RU обязателен; из написаний,
    дающих этот звук, берём ближайшее к буквам RU (удвоения сохраняются: Oldenkott, Anninov, Apollon, Retedly, Illofillion),
    а где буквальная передача искажает английское чтение — английское написание того же звука (Obersvode — «-воуд»; Tendle
    — «-дль»: слоговое [l] в английской орфографии пишется -le, ср. Tindle, Kendle; это правило транслитерации, а не догадка
    о «настоящей» фамилии). Рекомендация: (в) — он согласует Obersvode и Tendle и совпадает с остальными текущими рабочими
    вариантами; для этой записи — Tendle (Tendl — при варианте (а), Tendly — при варианте (б) не сохраняется: лишний звук).
    Конкретную английскую фамилию (Tyndall и т. п.) текст не подсказывает — такую догадку не предлагаю. До решения рабочий
    вариант — Tendl (прежний рабочий, §9.2 п.2): новая форма Tendle не вводится до утверждения.'

