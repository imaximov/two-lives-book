- id: francisk
  ru: Франциск
  ru_forms: [Франциск, Франциска, Франциску, Франциском, Франциске]
  gender: m
  role: Брат Франциск — монах-целитель в Общине Али (аптека, больница); наставник рассказчика в части III.
  aliases:
  - name: брат Франциск
    ids: [p3-c03-006, p3-c11-012]
  origin: 'Не указано. Что есть: «монах» (p3-c11-012 «Ведь Вы не монах, как брат Франциск»; p3-c11-022 «невежественный монах»
    — слова профессора); говорит с сестрой Александрой по-французски (p3-c03-059, 062).'
  address: {to_Levushka: ты (p3-c02-245 «милый брат»; p3-c05-020)}
  tier: core
  first_seen: p3-c02-234
  counts: {p1: 0, p2: 0, p3: 438}
  evidence:
  - {id: p3-c02-234, ru: Брата этого звали Франциск., en_legacy: This male nurse’s name was Francisco.}
  - {id: p3-c11-012, ru: 'Ведь Вы не монах, как брат Франциск, и обетов, очевидно, еще не успели дать никаких.'}
  en:
    name: Francis
    legacy: Francisco — Vol3 428 (304 + 124 ’s)
    avoid: [Francisco]
    status: proposed
  question: 'Francisco (старый EN) / Francis / Franciscus? Происхождение героя текст не называет. RU «Франциск» — традиционная
    русская передача латинского Franciscus (так по-русски зовут святого Франциска Ассизского и французских королей); испанское
    Francisco по-русски было бы «Франсиско». Francisco, таким образом, не соответствует RU-форме; английское соответствие
    русскому «Франциск» — Francis. Для монаха это к тому же обычная форма (brother Francis). Рекомендация: Francis (brother
    Francis); Franciscus — если владелец хочет подчеркнуть латинскую «монашескую» форму.'

