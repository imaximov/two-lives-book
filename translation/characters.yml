- id: khava
  ru: Хава
  ru_forms: [Хава, Хавы, Хаве, Хаву, Хавой]
  gender: f
  role: Чернокожая служанка-секретарь сэра Уоми в доме в Б.; позже помогает Жанне с детьми.
  aliases: []
  origin: 'Текст говорит только о внешности: «Это была чёрная статуя» (p1-c14-061), «Европейцы редко переносят чёрную кожу»
    (p1-c14-087), «негритянка» (p1-c22-222), «будет петь им негритянские песни» (p1-c26-199). Страна не названа.'
  address: {}
  tier: core
  first_seen: p1-c14-086
  counts: {p1: 117, p2: 0, p3: 8}
  evidence:
  - {id: p1-c14-086, ru: '— Да, Хава, могут. Познакомься ещё с одним моим другом.', en_legacy: '“Yes, Chava, they may. Here,
      become acquainted with one more friend of mine.”'}
  - {id: p1-c14-087, ru: 'Европейцы редко переносят чёрную кожу, — ответила Хава…'}
  en:
    name: Khava
    legacy: Chava — Vol1 120 (108 + 12 ’s), Vol3 8
    avoid: []
    status: proposed
  question: 'Общий вопрос о букве «х» в именах. Старый EN передаёт её как «ch»: Chava (Хава), Machmed (Махмуд), Zeiched (Зейхед);
    английский читатель прочтёт «ch» как [tʃ], то есть звук меняется (по принципу общего вопроса в tendl это ошибка передачи,
    а не вкус). Варианты: (а) сохранить ch (старый EN); (б) kh — стандартная передача «х» (Khava, Zeykhed); (в) h (Hava).
    Происхождение Хавы текст не называет, так что подсказки «по-родному» нет. Вместе с «х» решается окончание «-оглы» (Зейхед-оглы):
    -ogly (буквально) или -oglu (распространённая английская передача тюркского oğlu); -ogly для английского глаза созвучно
    ugly (языковое ревью), но основания по тексту (DEC-028) — на усмотрение владельца. Рекомендация: единое правило для всех
    имён с «х» — kh (Khava, Zeykhed-ogly), кроме имён, для которых есть устоявшаяся форма (Mahmud — см. ali-mahmud; Ibrahim);
    -ogly/-oglu — решает владелец.'

