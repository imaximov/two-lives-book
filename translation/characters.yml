# Персонажи «Две жизни» (TRANSLATION-PROCESS §9.4, DEC-002, DEC-011, DEC-015, DEC-028).
# Этап 3 — ЯДРО: главные персонажи частей I–III (≥50 упоминаний в RU или важные для сюжета/ошибок старого EN) и
# персонажи пилотной главы и калибровочных отрывков. Эпизодические — поглавно.
#
# Все имена сейчас `proposed`; имена персонажей — `core`, утверждает только владелец. Имя восстанавливается по
# основаниям в тексте (происхождение, прямые указания), «естественнее по-английски» недостаточно (DEC-028).
# Поля сверх §9.4: aliases (другие имена того же лица — с ID), origin (что текст говорит о происхождении — с ID),
# address (ты/вы — с ID), counts (вхождения всех форм по частям), evidence, question.
# PL-формы — на этапе 10. Проверка: python -m tools.glossary.check
# По итогам внутреннего ревью ядра (translation/reviews/en/glossary-core/resolution.md): в en.name — ровно один рабочий
# вариант; имя без оснований в тексте не становится рабочим — там en.name = вариант старого EN, предложение — в question
# (Katherine, Obersvode, Saintger, Amedeo, Wodsword); общий вопрос о буквенном несоответствии RU — в записи tendl.

entries:

# ════════════════════════════════════════════════════════════════════════════════════════════════════
# ЧАСТЬ I
# ════════════════════════════════════════════════════════════════════════════════════════════════════

- id: levushka
  ru: Лёвушка
  ru_forms: [Лёвушка, Лёвушки, Лёвушке, Лёвушку, Лёвушкой, Левушка, Левушки, Левушке, Левушку, Левушкой]
  gender: m
  role: Рассказчик частей I и III (в части II повествование от третьего лица, он упоминается 30 раз). Лев Николаевич, граф
    Т., младший брат капитана Т. (Николая); писатель.
  aliases:
  - name: Лев Николаевич
    ids: [p1-c18-077, p1-c25-196, p1-c25-198]
    note: так его называют князь (p1-c18-077 — единственное обращение), Ананда (p1-c25-196) и Ольга (p1-c25-198) — в двух
      последних это упоминание, не обращение; всего 3 раза
  - name: граф Т.
    ids: [p3-c04-010]
    note: «А это — Левушка, граф Т., — представил нас друг другу И.»
  - name: Лёвушка-лови ворон / Левушка «лови ворон»
    ids: [p1-c14-069, p3-c02-234]
    note: шутливое прозвище, относится к глоссарию
  origin: 'Русский: приезжает к брату «в среднеазиатский большой торговый город» (p1-c01-003); брат — капитан М-ского полка;
    «граф Т.» (p3-c04-010); «Он писатель» (p3-c20-145, слова Раданды).'
  address: {brother_Nikolay: 'ты ↔ ты (p1-c01-037: «Левушка, да где же ты пропадал?»)', Florentiets_to_him: 'сначала «вы»
      (p1-c03-054 «а сами зовите меня…»), затем «ты» (p1-c07-173 «А я-то думал угодить тебе»)', him_to_Florentiets: 'вы (p1-c07-173
      «Как я соскучился без вас»; p1-c14-068 «Увижу ли я вас, дорогой Флорентиец?»)', I_to_him: 'сначала «вы» (p1-c07-098),
      затем «ты» (p1-c14-072 «Что тебя веселит, Лёвушка?»)', him_to_I: 'вы (p1-c14-073, p1-c18-012 «Я вам ничего не говорил,
      Лоллион»)', Ali_elder_Uomi_Ananda_Francisk_Radanda_to_him: ты (p1-c03-110; p1-c14-074; p1-c22-069; p3-c02-245 «милый
      брат»; p3-c33-093 «Мой милый сын»), him_to_Uomi_Ananda: вы (p1-c22-151; p1-c24-109)}
  tier: core
  first_seen: p1-c01-001
  counts: {p1: 279, p2: 30, p3: 340}
  note: 'В RU-издании два написания одного имени: «Лёвушка» (главы p1-c12…c21, почти только там) и «Левушка» (остальное и
    вся часть III) — это непоследовательность расстановки «ё», а не разные формы: Лёвушка — уменьшительное от «Лев» (Лёва),
    произносится с «ё» при любом написании.'
  evidence:
  - {id: p1-c01-037, ru: '«Левушка, да где же ты пропадал? Я уже собирался было тебя искать».', en_legacy: '“Lovushka, where
      have you been? I was already about to go looking for you!”'}
  - {id: p1-c14-072, ru: '— Что тебя веселит, Лёвушка? — спросил И., нахмурясь.'}
  - {id: p1-c18-077, ru: — Очень хорошем. Лев Николаевич; княгиня уже пыталась держать в руке чайную ложечку…, en_legacy: '“Everything’s
      all right, Lev Nikolayevich. The duchess is already trying to hold a teaspoon…”'}
  - {id: p3-c04-010, ru: 'А это — Левушка, граф Т., - представил нас друг другу И.', en_legacy: 'And here is Lovushka, count
      T.'}
  en:
    name: Lyovushka
    legacy: 'Lovushka — Vol1 284 (278 + 6 ’s), Vol2 31 (26 + 5), Vol3 212 (202 + 10); Lyovushka — Vol3 125 (118 + 7), только
      с p3-c17 (c17: 6/6, c18 и далее — только Lyovushka); Lev (Nikolayevich) — Vol1 3'
    avoid: [Lovushka, Levushka]
    status: proposed
  question: 'Как писать имя рассказчика? Варианты: (а) Lovushka — старый EN частей I–II и большей части III; (б) Lyovushka
    — старый EN с p3-c17; (в) Levushka — пример в TRANSLATION-PROCESS §9.4 (это плейсхолдер, не решение). Доводы: имя — уменьшительное
    от «Лев» через «Лёва», с «ё»; RU-издание само пишет и «Лёвушка» (138), и «Левушка» (511), то есть «е» здесь — пропущенная
    «ё», а не другое произношение. Старый EN в той же части I передаёт «ё» как «yo»: «Борис Фёдорович» → «Boris Fyodorovich»
    (p1-c16-065), то есть Lovushka расходится с собственной практикой старого перевода; Levushka даст неверное чтение «е».
    Рекомендация: Lyovushka во всех частях; «Лев Николаевич» → Lev Nikolayevich (как в старом EN); «граф Т.» → Count T.'

- id: nikolay
  ru: Николай
  ru_forms: [Николай, Николая, Николаю, Николаем, Николае]
  gender: m
  role: Старший брат рассказчика, капитан Т. (капитан М-ского полка, учёный-самоучка, автор книг); в части I бежит с Наль,
    в части II — её муж в Англии; в части III — «запись брата Николая».
  aliases:
  - name: капитан Т.
    ids: [p1-c01-021, p2-c01-001]
    note: RU «капитан[а] Т.» — 8 / 20 / 0
  - name: граф Т. / лорд Т.
    ids: [p2-c11-004, p2-c01-014]
    note: 'в Англии: «Теперь вы — графиня, жена лорда Т.» (p2-c01-014, слова Николая Наль)'
  - name: брат, брат Николай
    ids: [p1-c01-065, p1-c02-106]
    note: в части I чаще всего просто «брат» — это слово не посчитано
  - name: Николушка
    ids: [p1-c01-088, p1-c01-101]
    note: уменьшительное в речи и мыслях Левушки, 2 раза, только пилотная глава; старый EN — Nikolushka (2)
  - name: брат-отец
    ids: [p1-c01-066, p1-c02-107, p1-c02-121]
    note: '26 раз (19 / 0 / 7): «как ты любил называть меня» (p1-c02-107, письмо Николая); старый EN — brother-father 25 (см.
      glossary brat#sibling)'
  origin: Русский, брат рассказчика (p1-c01-003 «погостить к брату, капитану М-ского полка»).
  address: {to_Nal: 'вы — и Наль это мучает: «Он точно боится меня и говорит мне «вы»» (p2-c01-207; ср. p2-c01-079)', Ali_elder_to_him: 'ты
      (p1-c02-039 «Ты, друг Николай…»)'}
  tier: core
  first_seen: p1-c01-065
  counts: {p1: 15, p2: 265, p3: 34}
  note: Nikolaj в Vol1 — единичный разнобой; по умолчанию — вариант большинства старого EN.
  evidence:
  - {id: p1-c01-065, ru: '…я снова увидел родное, близкое, с детства знакомое лицо любимого брата Николая…'}
  - {id: p1-c01-021, ru: '— Капитан Т.? — вскричал с восточным азартом купец.', en_legacy: '“Captain T.?” the trader shouted…'}
  - {id: p2-c01-014, ru: '— Перейдём на английский, Наль. Теперь вы — графиня, жена лорда Т.'}
  en:
    name: Nikolay
    legacy: Nikolay — Vol1 12, Vol2 280 (238 + 42 ’s), Vol3 31; Nikolaj — Vol1 5 (3 + 2 ’s); Nikolushka — Vol1 2
    avoid: [Nikolaj]
    status: proposed
    note: «Николушка» → Nikolushka (как в старом EN); «брат-отец» → brother-father

- id: florentiets
  ru: Флорентиец
  ru_forms: [Флорентиец, Флорентийца, Флорентийцу, Флорентийцем, Флорентийце]
  gender: m
  role: Друг Али и покровитель братьев; в Англии живёт как лорд Бенедикт, «отец» (приёмный) Наль. Одна из центральных фигур
    всех трёх частей.
  aliases:
  - name: лорд Бенедикт
    ids: [p1-c03-054, p2-c01-174, p2-c01-263]
    note: 'p1-c03-054: «Представляйте меня лордом Бенедиктом, а сами зовите меня Флорентийцем, как зовут меня свои»; в части
      II — основное имя в повествовании (Бенедикт: 15 / 571 / 1). Сандра обращается к нему «лорд Бенедикт» при Наль (p2-c01-174)'
  - name: Венецианец
    ids: [p3-c27-026, p3-c28-002, p3-c33-028]
    note: «тот, кого ты привык звать Флорентийцем, но чье имя на самом деле Венецианец» (p3-c27-026; RU «Венецианец» 0 / 0
      / 3); после этого рассказчик и Али зовут его так как обычным именем («дорогой мой друг Венецианец» p3-c28-002, «Венецианец
      и многие его сотрудники» p3-c33-028); старый EN — Venetian
  - name: Отец (для Наль)
    ids: [p2-c01-205]
    note: '«Тот, кому я сказала: «Отец»»; он представляет её «Моя дочь» (p2-c01-168)'
  origin: 'Итальянец из Флоренции — сказано дважды прямо: p1-c03-013 «Я и есть итальянец, и родина моя Флоренция»; p2-c20-080
    «Я действительно родом из Флоренции. Когда-то, очень давно, у меня были основания скрывать своё имя. Я жил под прозвищем,
    которое с годами стало моим именем. Так я и остался Флорентийцем». Настоящего имени никто не знает: p2-c01-087 «Так его
    все зовут, а имени его ни я и никто не знает». «Лорд Бенедикт» — изначально роль: p1-c03-052 «Ваши знакомые будут думать,
    что я и в самом деле английский лорд».'
  address: {to_Levushka: вы → ты (см. levushka), to_Nal: 'ты (p2-c01-113 «Смейся, дитя…»)'}
  tier: core
  first_seen: p1-c03-054
  counts: {p1: 348, p2: 461, p3: 141}
  evidence:
  - {id: p1-c03-013, ru: '— Я и есть итальянец, и родина моя Флоренция.', en_legacy: '“Well, I am Italian and my homeland
      is Florence.”'}
  - {id: p1-c03-054, ru: 'Представляйте меня лордом Бенедиктом, а сами зовите меня Флорентийцем, как зовут меня свои.', en_legacy: 'Among
      the strangers I am the lord Benedict, but you can call me Florentian, like everyone is doing.'}
  - {id: p2-c20-080, ru: 'Я действительно родом из Флоренции. […] Я жил под прозвищем, которое с годами стало моим именем.
      Так я и остался Флорентийцем.', en_legacy: 'I’m really descended from Florence. Once, a long time ago I had my own reasons
      to conceal my name. People knew me under this surname which eventually beca[me]…'}
  - {id: p1-c07-177, ru: …всем известен его неподражаемый флорентийский талант ловить людей на слове., en_legacy: …his unique
      florentian talent to cavil at every word…}
  en:
    name: the Florentine
    legacy: Florentian — Vol1 358 (317 + 41 ’s), Vol2 489 (374 + 115), Vol3 146 (107 + 39); опечатки Florantian (Vol2 1),
      Floretian (Vol3 1); прилагательное florentian (p1-c07-177). Benedict — Vol1 15, Vol2 598 (409 + 188 ’s + 1 Benedicts),
      Vol3 1; «лорд Бенедикт» в старом EN — lord Benedict со строчной
    avoid: [Florentian]
    status: proposed
    note: Lord Benedict — с прописной (legacy-en-report §6.3 п.7).
  question: 'Как передать прозвище? Варианты: (а) Florentian — старый EN, ≈1000 раз; такого слова в английском нет; (б) the
    Florentine — «флорентиец», житель/уроженец Флоренции; (в) Florentine без артикля как имя собственное. Доводы из текста:
    прозвище значит буквально «человек из Флоренции» — герой сам объясняет его происхождением (p1-c03-013, p2-c20-080) и говорит,
    что прозвище «стало моим именем»; прилагательное «флорентийский талант» (p1-c07-177) и «во Флоренции есть обычай… обряд
    моей родины» (p2-c14-150) — та же Флоренция. Параллель в части III: «Флорентийцем, но чье имя на самом деле Венецианец»
    (p3-c27-026) — старый EN там же пишет «Venetian», то есть для второго прозвища сам использует нормальное английское слово.
    Florentian — не английское слово, значит, вариант старого EN ошибочен (§9.2 п.6 не держит). Без артикля «Florentine» читается
    как французское женское имя. Рекомендация: the Florentine (артикль, прописная F; в обращении — без артикля: “dear Florentine”;
    притяжательная форма the Florentine’s); прилагательное — Florentine; «Венецианец» (p3-c27-026) — the Venetian.'

- id: illofillion
  ru: И.
  ru_forms: [И., Иллофиллион, Иллофиллиона, Иллофиллионом]
  gender: m
  role: Грек, врач и учёный-математик, друг Флорентийца; с p1-c08 наставник и спутник рассказчика; в части III — «Учитель
    И.» в Общине Али.
  aliases:
  - name: Иллофиллион
    ids: [p1-c07-031, p1-c07-055, p1-c07-064, p1-c07-072, p1-c07-074]
    note: полное имя — всего 5 раз, только в главе p1-c07, до первого «И.» (p1-c07-079); дальше в частях I–III только «И.»
  - name: Лоллион
    ids: [p1-c07-112, p1-c07-155, p1-c12-072]
    note: детское ласкательное имя от няни; рассказчик с p1-c12-072 зовёт его так в прямом обращении — 32 раза, только часть
      I, всегда полностью
  - name: Эвклид
    ids: [p1-c07-155, p1-c07-173, p1-c08-021]
    note: шутливое прозвище наставников за способности к математике; так его зовёт Флорентиец (8 раз, p1-c07/c08/c25)
  - name: доктор И., Учитель И.
    ids: [p1-c15-169, p3-c02-050, p3-c20-045]
    note: титулы при инициале
  origin: 'Грек: p1-c07-027 «Другой мой друг — грек. […] Великолепный математик»; p1-c07-058 говорит «с сильным иностранным
    акцентом… но совершенно правильно по-русски»; p1-c09-022 Лиза: «мой родственник такой типичный грек». Детство — на острове
    (p1-c07-099 «в другую часть острова к старой няне»); семья погибла (p1-c07-098).'
  address: {to_Levushka: вы → ты (см. levushka), Levushka_to_him: 'вы, по имени «Лоллион» (p1-c14-073)', Florentiets_to_him: 'ты,
      «Эвклид» (p1-c07-173)'}
  tier: core
  first_seen: p1-c07-027
  counts: {p1: 1064, p2: 21, p3: 1796}
  note: 'Инициал — авторский приём, а не прозвище персонажа: «И.» стоит не только в повествовании, но и в прямой речи других
    героев — «мой брат И.» (p1-c15-026), «доктор И.» (p1-c15-169), обращение «Жанна очень огорчила меня, И.» (p1-c16-055);
    по моему подсчёту «И.» внутри реплик — 232 раза. Тем же приёмом в тексте скрыты места и лица: «в К.», «капитан Т.», «граф
    Т.», «семейство Е.».'
  evidence:
  - {id: p1-c07-031, ru: Грека зовут Иллофиллион. Он говорит по-русски плохо…, en_legacy: Greek’s name was – Ilofilion. His
      Russian is poor…}
  - {id: p1-c07-079, ru: '— А хотелось бы вам путешествовать? — услышал я вопрос И.', en_legacy: '“Would you like to travel?”
      I heard I.’s question.'}
  - {id: p1-c07-155, ru: '…мне дали шутливое прозвище «Эвклид». Так меня и звали мои наставники, одна няня кликала меня Лоллионом.',
    en_legacy: '…jokingly I was nicknamed Euclid. Both of my guardians were calling me like that, only my nurse kept calling
      me Lolion.'}
  - {id: p1-c08-032, ru: Через полчаса мы с И. должны были ехать на вокзал., en_legacy: In half an hour I and I. had to go
      to the station already.}
  en:
    name: Il.
    legacy: 'I. — Vol1 1120, Vol2 22, Vol3 1794 (из них с ’s: 122 / 4 / 321); Ilofilion — Vol1 5; Lolion — Vol1 32; Euclid
      — Vol1 7 (6 + 1 ’s). Неоднозначные места: «I and I.» / «I. and I» / «me and I.» — 22 / 0 / 9; «I. I…» (инициал, затем
      местоимение) — 13 / 0 / 19, напр. p1-c12-093 «…by the careful hands of I. I already was about to find…»; «I.» в начале
      предложения — 376 / 1 / 279'
    avoid: []
    status: proposed
    note: 'Полное имя (5 мест p1-c07) — Illofillion (в RU двойные л/ф/л: Илло-фил-лион; Ilofilion теряет удвоения); «Лоллион»
      → Lollion (по RU, legacy Lolion); «Эвклид» → Euclid (как в старом EN). Удвоения — см. общий вопрос о буквенном несоответствии
      RU — tendl.'
  question: 'Как писать «И.»? Варианты: (а) I. — старый EN, ≈2900 раз; точно повторяет авторский однобуквенный инициал, но
    сливается с местоимением I (см. счёт в en.legacy: «I and I.», «I. I already…», «I heard I.’s question»); (б) Il. — сохраняет
    приём (сокращение, имя скрыто), снимает омонимию; минус — две буквы вместо одной, в RU такого нет; (в) Illofillion везде
    — однозначно, но уничтожает авторский приём: в RU полное имя дано 5 раз в p1-c07 и затем сознательно заменено инициалом,
    даже в чужой прямой речи; (г) I. с типографским отличием (капитель и т. п.) — ненадёжно в EPUB и в поиске. Рекомендация:
    (б) Il. во всех частях, включая «доктор И.» → Doctor Il., «Учитель И.» → Teacher Il.; полное имя в p1-c07 — Illofillion.
