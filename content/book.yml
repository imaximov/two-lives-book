    - id: p3-c18
      number: 18
      title:
        ru: Трапезная. События в ней. Мое новое понимание жизненных путей человеческих
    - id: p3-c19
      number: 19
      title:
        ru: Первый завтрак в новой столовой. Школа. Я передаю письмо Франциска матери больного ребенка. Помощь И. в моем знакомстве
