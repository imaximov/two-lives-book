    - id: p3-c20
      number: 20
      title:
        ru: Мои новые знакомства в Общине. Первая неудача во встрече с жителями из оазиса Дартана. Раданда. Часовня Радости.
          Выполнение поручения. Дартана с помощью Раданды
    - id: p3-c21
      number: 21
      title:
        ru: Мы едем встречать Яссу. История его жизни, рассказанная нам И. Встреча с Яссой и необычайное видение в пустыне.
          Возвращение в Общину и посвящение Яссы. Трапезная. Разговор с Грегором. Две речи И. в трапезной и на балконе
    - id: p3-c22
      number: 22
      title:
        ru: Последний утренний завтрак отъезжающих. Напутствие детям. Еще раз Ариадна. Рассказ Мулги о Раданде. Уединенный
          скит строптивцев. Старанда и Георгий. Беседа И. с Андреевой и Ольденкоттом
    - id: p3-c23
      number: 23
      title:
        ru: Беседа И. с Бронским и Игоро. Наставление им к труду в оазисе Дартана. Неожиданная встреча с леди Бердран. Доктор.
          Ариадна, ее сын и ее трагедия. Вторая беседа И. с Андреевой и Ольденкоттом об их миссии в миру. Последние сборы
          и отъезд в оазис темнокожих. Первые впечатления от оазиса. Мать Анна
    - id: p3-c24
      number: 24
      title:
        ru: Первый ужин в круглом доме в оазисе матери Анны. Зал и наши сотрапезники. Речи матери Анны и И. Работа И, его
          наставления и приготовления к встрече бури всего населения оазиса. Маяк. Страшная ночь бури. «Чудо», совершенное
          И. Мы сходим с маяка. Ясса, его мертвый сон и мое отчаяние. Моя работа у ворот. Собаки-искатели. После бури. Мы
          посещаем Ольденкотта и Андрееву
    - id: p3-c25
      number: 25
      title:
        ru: Мое пробуждение. Как я ищу И. И. на заводе в роли рабочего. Первый обед в оазисе после бури. Беседа И. с сотрапезниками.
          Владыки оазиса
    - id: p3-c26
      number: 26
      title:
        ru: Лаборатории стихий. Лучи путей человеческих. Их возглавляющие Великие Учителя, Светлые сонмы невидимых помощников,
          Их труд для человечества земли. Неожиданное видение в седьмом луче
    - id: p3-c27
      number: 27
      title:
        ru: Мое пробуждение в комнате с диваном. Возвращение в лабораторию. Беседа в ней с Владыкой. Божественное видение
    - id: p3-c28
      number: 28
      title:
        ru: Второе пробуждение в необычайной комнате Владыки. Что говорит мне живой портрет на стене. Еще одно Божественное
          видение. Последнее наставление моего Владыки-Учителя. Посещение Владыки-Главы, беседа с ним в его комнате и беседа
          в "Святая Святых
    - id: p3-c29
      number: 29
      title:
        ru: Башня стихий природы в лаборатории Владыки-Главы. Его объяснения мне и башня стихий в пространстве. Стражи стихий,
          их труд и роль в передаче творческого вдохновения. Великий Учитель Маха-Чохан. Его роль в мировом труде. Последнее
          наставление Владыки-Главы мне и Андреевой. Наш выход из лаборатории стихий и новая встреча с И.
    - id: p3-c30
      number: 30
      title:
        ru: Возвращение к жизни. Еще раз оазис Матери Анны и первое свидание с нею. Новые аллеи и памятники нашей любви и
          благодарности на них. Закладка часовни "Звучащая Радость"
    - id: p3-c31
      number: 31
      title:
        ru: Беседа И. с жителями оазиса в ночь закладки часовни. Работа И., Василиона и моя над расцветкой статуи и установка
          ее в часовне. Последняя ночь перед освящением часовни. Деметро и его поручение ко мне. Слова И. при открытии часовни
    - id: p3-c32
      number: 32
      title:
        ru: Прощальная речь И. обитателям оазиса матери Анны. Приезд в Общину Раданды и первая вечерняя трапеза. Наставление
          И. отъезжающим и остающимся. Часовня скорби. Отъезд в оазис Дартана Грегора, Василиона, Бронского и Игоро. Отъезд
          в Америку Андреевой и Ольденкотта
    - id: p3-c33
      number: 33
      title:
        ru: Еще раз часовня и поселок плачущих. Речь И. плачущим. Мое прощальное посещение часовни Радости. Прощальный вечерний
          пир в Общине Раданды. Последняя речь И. на нем. Наш отъезд в Общину Али
